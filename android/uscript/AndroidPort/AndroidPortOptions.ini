[EnableHardwarePhysics UTUIDataProvider_MenuOption]
FriendlyName=PhysX effects (CPU)
Description=The original hardware PhysX path for scenes, cloth and fluids. On Android the original CPU solver simulates them in both settings; with the option on, DM-HeatRay_PhysX ran about 6% slower on a Helio G90T. Maps made for PhysX hardware (PhysX Mod Pack) are CPU-heavy either way. Takes effect on the next map.

[HardwareOpenAL UTUIDataProvider_MenuOption]
FriendlyName=OpenAL (AAudio / EAX)
Description=Enable native OpenAL with EAX reverb over AAudio. Effects are processed on the CPU: about 20% fewer frames per second on a tested tablet. Requires a restart.

